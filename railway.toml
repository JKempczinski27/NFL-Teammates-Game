[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install"

[deploy]
# STEP 1: First deploy will run migration
# After migration completes, change this to: cd backend && npm start
startCommand = "cd backend && node migrate-to-single-table.js && sleep infinity"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
