# Nixpacks configuration for NFL Games Backend
# This file is located in the backend directory
# Railway Root Directory should be set to: backend

[variables]
# Force cache invalidation - change this number to rebuild
CACHE_BUST = "2"

[phases.setup]
nixPkgs = ['nodejs_22']
aptPkgs = []

[phases.install]
cmds = ['npm install --omit=dev --prefer-offline']

[phases.build]
# No build step needed - this is a pure Node.js server
dependsOn = ['install']

[start]
cmd = 'node index.js'
