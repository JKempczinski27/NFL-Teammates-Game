<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A/B Testing Dashboard - NFL Games</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5em;
    }

    .subtitle {
      color: #666;
      font-size: 1.1em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-value {
      font-size: 2.5em;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .experiments-list {
      background: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .section-title {
      font-size: 1.8em;
      margin-bottom: 20px;
      color: #333;
    }

    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #667eea;
      color: white;
    }

    .experiment-card {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      border-left: 5px solid #667eea;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .experiment-card:hover {
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transform: translateX(5px);
    }

    .experiment-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .experiment-name {
      font-size: 1.4em;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .experiment-status {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-active {
      background: #4caf50;
      color: white;
    }

    .status-draft {
      background: #ff9800;
      color: white;
    }

    .status-completed {
      background: #2196f3;
      color: white;
    }

    .status-paused {
      background: #9e9e9e;
      color: white;
    }

    .experiment-meta {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      font-size: 0.9em;
      color: #666;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .experiment-results {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 2px dashed #ddd;
    }

    .experiment-results.show {
      display: block;
    }

    .variants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .variant-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }

    .variant-card.winner {
      border-color: #4caf50;
      background: #f1f8f4;
    }

    .variant-name {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 10px;
      color: #333;
    }

    .variant-metric {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9em;
    }

    .metric-label {
      color: #666;
    }

    .metric-value {
      font-weight: 600;
      color: #333;
    }

    .lift {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }

    .lift.positive {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .lift.negative {
      background: #ffebee;
      color: #c62828;
    }

    .significance-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
      margin-left: 10px;
    }

    .significance-badge.significant {
      background: #4caf50;
      color: white;
    }

    .significance-badge.not-significant {
      background: #ff9800;
      color: white;
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-top: 25px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 1.2em;
    }

    .refresh-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #667eea;
      color: white;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      transform: scale(1.1);
      background: #5568d3;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .variants-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧪 A/B Testing Dashboard</h1>
      <p class="subtitle">Content Testing & Experiment Results</p>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="activeExperiments">-</div>
        <div class="stat-label">Active Tests</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="completedExperiments">-</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalParticipants">-</div>
        <div class="stat-label">Total Participants</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalConversions">-</div>
        <div class="stat-label">Conversions</div>
      </div>
    </div>

    <div class="experiments-list">
      <h2 class="section-title">Experiments</h2>

      <div class="filters">
        <button class="filter-btn active" onclick="filterExperiments('all')">All</button>
        <button class="filter-btn" onclick="filterExperiments('active')">Active</button>
        <button class="filter-btn" onclick="filterExperiments('completed')">Completed</button>
        <button class="filter-btn" onclick="filterExperiments('draft')">Draft</button>
      </div>

      <div id="experimentsList">
        <div class="loading">Loading experiments...</div>
      </div>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadData()" title="Refresh data">↻</button>

  <script>
    let experiments = [];
    let currentFilter = 'all';

    // Load data on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
    });

    async function loadData() {
      try {
        // Load summary stats
        const summaryResponse = await fetch('/api/experiments/stats/summary');
        const summary = await summaryResponse.json();

        if (summary.success) {
          document.getElementById('activeExperiments').textContent = summary.summary.active_experiments || 0;
          document.getElementById('completedExperiments').textContent = summary.summary.completed_experiments || 0;
          document.getElementById('totalParticipants').textContent = summary.summary.total_participants || 0;
          document.getElementById('totalConversions').textContent = summary.summary.total_conversions || 0;
        }

        // Load experiments
        const experimentsResponse = await fetch('/api/experiments');
        const data = await experimentsResponse.json();

        if (data.success) {
          experiments = data.experiments;
          displayExperiments();
        }
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('experimentsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div>Failed to load experiments. Please try again.</div>
          </div>
        `;
      }
    }

    function filterExperiments(status) {
      currentFilter = status;

      // Update active button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      displayExperiments();
    }

    function displayExperiments() {
      const container = document.getElementById('experimentsList');

      // Filter experiments
      const filtered = currentFilter === 'all'
        ? experiments
        : experiments.filter(exp => exp.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔬</div>
            <div>No ${currentFilter === 'all' ? '' : currentFilter} experiments found.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(exp => `
        <div class="experiment-card" onclick="toggleResults('${exp.id}')">
          <div class="experiment-header">
            <div>
              <div class="experiment-name">${exp.name}</div>
              <div style="color: #666;">${exp.description || 'No description'}</div>
            </div>
            <span class="experiment-status status-${exp.status}">${exp.status}</span>
          </div>

          <div class="experiment-meta">
            <div class="meta-item">
              <span>🎯</span>
              <span>Metric: ${exp.primary_metric}</span>
            </div>
            <div class="meta-item">
              <span>🎮</span>
              <span>Game: ${exp.game_type}</span>
            </div>
            <div class="meta-item">
              <span>👥</span>
              <span>Traffic: ${exp.traffic_allocation}%</span>
            </div>
          </div>

          <div class="experiment-results" id="results-${exp.id}">
            <div class="loading">Loading results...</div>
          </div>
        </div>
      `).join('');
    }

    async function toggleResults(experimentId) {
      const resultsDiv = document.getElementById(`results-${experimentId}`);

      if (resultsDiv.classList.contains('show')) {
        resultsDiv.classList.remove('show');
        return;
      }

      // Load results
      try {
        resultsDiv.innerHTML = '<div class="loading">Loading results...</div>';
        resultsDiv.classList.add('show');

        const response = await fetch(`/api/experiments/${experimentId}/results`);
        const data = await response.json();

        if (data.success) {
          displayResults(resultsDiv, data.results, data.statistics);
        }
      } catch (error) {
        console.error('Error loading results:', error);
        resultsDiv.innerHTML = '<div style="color: red;">Failed to load results</div>';
      }
    }

    function displayResults(container, results, statistics) {
      if (results.length === 0) {
        container.innerHTML = '<div style="color: #999;">No results yet. Wait for participants to interact with this experiment.</div>';
        return;
      }

      // Find control variant for comparison
      const control = results.find(r => r.variant_id === 'control') || results[0];

      const html = `
        <div class="variants-grid">
          ${results.map(variant => {
            const stat = statistics.find(s => s.variant_id === variant.variant_id);
            const isControl = variant.variant_id === control.variant_id;
            const lift = stat ? parseFloat(stat.lift) : 0;
            const isWinner = lift > 0 && stat?.is_significant;

            return `
              <div class="variant-card ${isWinner ? 'winner' : ''}">
                <div class="variant-name">
                  ${variant.variant_id}
                  ${isControl ? '(Control)' : ''}
                  ${isWinner ? '🏆' : ''}
                </div>

                <div class="variant-metric">
                  <span class="metric-label">Participants:</span>
                  <span class="metric-value">${variant.participants || 0}</span>
                </div>

                <div class="variant-metric">
                  <span class="metric-label">Completions:</span>
                  <span class="metric-value">${variant.completions || 0}</span>
                </div>

                <div class="variant-metric">
                  <span class="metric-label">Completion Rate:</span>
                  <span class="metric-value">${variant.completion_rate || 0}%</span>
                </div>

                <div class="variant-metric">
                  <span class="metric-label">Shares/User:</span>
                  <span class="metric-value">${variant.shares_per_user || 0}</span>
                </div>

                ${!isControl && stat ? `
                  <div class="lift ${lift >= 0 ? 'positive' : 'negative'}">
                    ${lift >= 0 ? '↑' : '↓'} ${Math.abs(lift)}% lift
                    <span class="significance-badge ${stat.is_significant ? 'significant' : 'not-significant'}">
                      ${stat.is_significant ? 'Significant' : 'Not Significant'}
                    </span>
                    <div style="font-size: 0.8em; margin-top: 5px;">
                      p-value: ${stat.p_value} | confidence: ${stat.confidence_level}%
                    </div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div class="chart-container">
          <canvas id="chart-${container.id}"></canvas>
        </div>
      `;

      container.innerHTML = html;

      // Create chart
      createComparisonChart(container.id, results);
    }

    function createComparisonChart(containerId, results) {
      const canvas = document.getElementById(`chart-${containerId}`);

      new Chart(canvas, {
        type: 'bar',
        data: {
          labels: results.map(r => r.variant_id),
          datasets: [
            {
              label: 'Completion Rate (%)',
              data: results.map(r => r.completion_rate || 0),
              backgroundColor: 'rgba(102, 126, 234, 0.6)',
              borderColor: 'rgba(102, 126, 234, 1)',
              borderWidth: 2
            },
            {
              label: 'Participants',
              data: results.map(r => r.participants || 0),
              backgroundColor: 'rgba(118, 75, 162, 0.6)',
              borderColor: 'rgba(118, 75, 162, 1)',
              borderWidth: 2,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Completion Rate (%)'
              }
            },
            y1: {
              beginAtZero: true,
              position: 'right',
              title: {
                display: true,
                text: 'Participants'
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
