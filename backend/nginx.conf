# NGINX Load Balancer Configuration
# This configuration distributes traffic across multiple backend instances

upstream nfl_games_backend {
    # Load balancing strategy: least_conn (least connections)
    # Other options: round_robin (default), ip_hash, random
    least_conn;

    # Backend server instances
    # Add more servers as you scale horizontally
    server backend1:3001 max_fails=3 fail_timeout=30s;
    server backend2:3001 max_fails=3 fail_timeout=30s;
    server backend3:3001 max_fails=3 fail_timeout=30s;
    # server backend4:3001 max_fails=3 fail_timeout=30s;

    # Health check configuration (nginx-plus only)
    # For open-source nginx, passive health checks are used above

    # Keep-alive connections to backends
    keepalive 32;
}

server {
    listen 80;
    server_name api.nflgameshub.com;  # Replace with your domain

    # Request ID for distributed tracing
    add_header X-Request-ID $request_id always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/nfl-games-access.log combined;
    error_log /var/log/nginx/nfl-games-error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API endpoints
    location / {
        proxy_pass http://nfl_games_backend;

        # Pass original client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Keep-alive to backends
        proxy_set_header Connection "";
    }

    # Health check endpoint (can be accessed directly)
    location /health {
        access_log off;  # Don't log health checks
        proxy_pass http://nfl_games_backend/health;
        proxy_set_header Host $host;
    }

    # Rate limiting zone (additional layer)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://nfl_games_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Stricter rate limiting for write operations
    location ~ ^/(save-player|api/stats|api/players|api/questions)$ {
        limit_req zone=strict_limit burst=5 nodelay;
        proxy_pass http://nfl_games_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
}

# SSL/TLS configuration (production)
server {
    listen 443 ssl http2;
    server_name api.nflgameshub.com;

    # SSL certificates (use Let's Encrypt with certbot)
    ssl_certificate /etc/letsencrypt/live/api.nflgameshub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nflgameshub.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Same configuration as port 80
    include /etc/nginx/conf.d/nfl-games-locations.conf;
}
