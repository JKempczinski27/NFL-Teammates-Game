<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="NFL GameHub - Play exciting NFL trivia and guessing games"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- OneTrust Cookie Consent Notice -->
    <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js"
            type="text/javascript"
            charset="UTF-8"
            data-domain-script="%REACT_APP_ONETRUST_DOMAIN_SCRIPT_ID%"></script>
    <script type="text/javascript">
      function OptanonWrapper() {
        // OneTrust callback - fires when consent preferences are updated
        const allowedGroups = window.OnetrustActiveGroups || "";

        // Standard OneTrust cookie categories:
        // C0001 - Strictly Necessary Cookies (always active)
        // C0002 - Performance Cookies (analytics)
        // C0003 - Functional Cookies
        // C0004 - Targeting Cookies (advertising)

        const hasNecessary = allowedGroups.includes("C0001");
        const hasPerformance = allowedGroups.includes("C0002");
        const hasFunctional = allowedGroups.includes("C0003");
        const hasTargeting = allowedGroups.includes("C0004");

        // Store consent state for React components
        window.oneTrustConsent = {
          necessary: hasNecessary,
          performance: hasPerformance,
          functional: hasFunctional,
          targeting: hasTargeting,
          timestamp: new Date().toISOString()
        };

        // Dispatch custom event for React to listen to
        window.dispatchEvent(new CustomEvent('oneTrustConsentUpdate', {
          detail: window.oneTrustConsent
        }));
      }
    </script>

    <title>NFL GameHub</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
