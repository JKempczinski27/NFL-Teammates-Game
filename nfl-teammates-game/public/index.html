<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- OneTrust Cookie Consent Notice -->
    <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js"
            type="text/javascript"
            charset="UTF-8"
            data-domain-script="%REACT_APP_ONETRUST_DOMAIN_SCRIPT_ID%"></script>
    <script type="text/javascript">
      function OptanonWrapper() {
        // OneTrust callback - fires when consent preferences are updated
        // Access consent groups via window.OnetrustActiveGroups
        const allowedGroups = window.OnetrustActiveGroups || "";

        // Standard OneTrust cookie categories:
        // C0001 - Strictly Necessary Cookies (always active)
        // C0002 - Performance Cookies (analytics)
        // C0003 - Functional Cookies
        // C0004 - Targeting Cookies (advertising)

        const hasNecessary = allowedGroups.includes("C0001");
        const hasPerformance = allowedGroups.includes("C0002");
        const hasFunctional = allowedGroups.includes("C0003");
        const hasTargeting = allowedGroups.includes("C0004");

        // Store consent state for React components
        window.oneTrustConsent = {
          necessary: hasNecessary,
          performance: hasPerformance,
          functional: hasFunctional,
          targeting: hasTargeting,
          timestamp: new Date().toISOString()
        };

        // Dispatch custom event for React to listen to
        window.dispatchEvent(new CustomEvent('oneTrustConsentUpdate', {
          detail: window.oneTrustConsent
        }));
      }
    </script>

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>

    -->
  </body>
</html>
