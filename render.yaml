services:
  - type: web
    name: nfl-teammates-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd nfl-teamates-game/backend && npm install
    startCommand: cd nfl-teamates-game/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
        generateValue: true
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false

databases:
  - name: nfl-teammates-db
    databaseName: nfl_teammates
    user: nfl_user
    region: oregon
    plan: free
