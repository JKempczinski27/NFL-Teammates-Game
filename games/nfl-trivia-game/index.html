<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Trivia Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">

    <!-- OneTrust Cookies Consent Notice -->
    <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js"
            type="text/javascript"
            charset="UTF-8"
            data-domain-script="%VITE_ONETRUST_DOMAIN_SCRIPT_ID%"></script>
    <script type="text/javascript">
      function OptanonWrapper() {
        console.log("🍪 OneTrust consent loaded");

        // Get active consent groups
        const allowedGroups = window.OnetrustActiveGroups || "";
        console.log("Active consent groups:", allowedGroups);

        // Check consent for each category
        const hasNecessary = allowedGroups.includes("C0001");  // Strictly Necessary
        const hasAnalytics = allowedGroups.includes("C0002");  // Performance/Analytics
        const hasFunctional = allowedGroups.includes("C0003"); // Functional
        const hasTargeting = allowedGroups.includes("C0004");  // Targeting/Marketing

        if (hasNecessary) {
          console.log("✅ Necessary cookies consented");
          window.canStartGame = true;
        }

        if (hasAnalytics) {
          console.log("📊 Analytics cookies consented");
          // Initialize analytics here when ready
          // Example: gtag('config', 'GA_MEASUREMENT_ID');
        }

        if (hasFunctional) {
          console.log("⚙️  Functional cookies consented");
        }

        if (hasTargeting) {
          console.log("📣 Targeting cookies consented");
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
